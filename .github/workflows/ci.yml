name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
      - name: Verify wheel manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tomllib
          wheel = next(Path('dist').glob('aelix_mattermost-*.whl'))
          with ZipFile(wheel) as archive:
              manifest = tomllib.loads(archive.read('aelix_mattermost/aelix-plugin.toml').decode())
              assert manifest['plugin']['id'] == 'aelix-mattermost'
              assert manifest['plugin']['entry']['python'] == 'aelix_mattermost.extension:setup'
          PY
